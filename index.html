<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --bg: #14171a;
    --surface: #1d2226;
    --surface-hi: #262c31;
    --gold: #c9a227;
    --gold-soft: #e8cf7a;
    --teal: #3a7d6e;
    --ink: #ede9e2;
    --muted: #8b9198;
    --line: #33393e;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Vazirmatn', sans-serif;
    min-height: 100vh;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 18px 60px;
  }

  .wrap {
    width: 100%;
    max-width: 420px;
  }

  /* --- signature: girih line motif --- */
  .motif {
    width: 84px;
    height: 84px;
    margin: 0 auto 18px;
    opacity: 0.92;
  }

  .eyebrow {
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--gold-soft);
    font-weight: 500;
    margin-bottom: 6px;
  }

  h1 {
    text-align: center;
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 8px;
    color: var(--ink);
  }

  .sub {
    text-align: center;
    font-size: 14.5px;
    color: var(--muted);
    font-weight: 300;
    margin: 0 0 34px;
    line-height: 1.9;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 28px;
  }
  .divider .l { flex: 1; height: 1px; background: var(--line); }
  .divider svg { flex-shrink: 0; opacity: 0.8; }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .tile {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    text-decoration: none;
    color: var(--ink);
    transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    opacity: 0;
    animation: rise 0.5s ease forwards;
  }

  .links a.tile:nth-of-type(1){ animation-delay: 0.05s; }
  .links a.tile:nth-of-type(2){ animation-delay: 0.12s; }
  .links a.tile:nth-of-type(3){ animation-delay: 0.19s; }
  .links a.tile:nth-of-type(4){ animation-delay: 0.26s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .tile { animation: none !important; opacity: 1 !important; transform: none !important; }
  }

  .tile:hover, .tile:focus-visible {
    background: var(--surface-hi);
    border-color: var(--gold);
    transform: translateY(-2px);
  }
  .tile:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; }

  .icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon svg { width: 24px; height: 24px; }

  .icon.whatsapp { background: rgba(60,168,110,0.14); color: #4fd18a; }
  .icon.telegram { background: rgba(51,144,199,0.14); color: #4db3e8; }
  .icon.eitaa    { background: rgba(201,162,39,0.14); color: var(--gold-soft); }
  .icon.map      { background: rgba(58,125,110,0.18); color: #6fc4ae; }
  .icon.web      { background: rgba(139,145,152,0.10); color: var(--muted); }

  .text { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .label { font-size: 15.5px; font-weight: 700; }
  .value { font-size: 12.5px; color: var(--muted); font-weight: 300; direction: ltr; text-align: right; unicode-bidi: plaintext; }

  .arrow { flex-shrink: 0; color: var(--muted); }

  .tile.disabled {
    cursor: default;
    pointer-events: none;
  }
  .tile.disabled .label { color: var(--muted); }
  .badge {
    font-size: 10.5px;
    font-weight: 500;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 3px 9px;
    border-radius: 999px;
    flex-shrink: 0;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 11.5px;
    color: #565c62;
    font-weight: 300;
    letter-spacing: 0.03em;
  }
</style>
</head>
